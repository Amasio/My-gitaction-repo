name: 09 - Using Functions

on:
    pull_request:
    workflow_dispatch:

jobs:
    echo1:
        runs-on: ubuntu-latest
        steps:
            - name: Failing stp
              run: exit 1
            - name: i will be skipped
              if: ${{success()}}
              run: echo "i will  print if previus step succeeds"
            - name: i will execute
              if: ${{failure()}}
              run: echo "i will print if any previus steps fails."
            - name: i will execute
              if: ${{!cancelled()}}
              run: echo "i will always print, except when the workflow is cancelled."
            - name: i will execute when cancelled              
              if: ${{cancelled()}}
              run: echo "i will print if workflow is cancelled."