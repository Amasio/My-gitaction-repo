name: 08 - Using Variables

on:
  push:
  workflow_dispatch:

env:
  WORKLOF_VAR: "i am a workflow env var"
  OVERWRITTEN: "env in workflow will be overvwritten" 
jobs:
    echo:
        runs-on: ubuntu-latest
        env:
          JOB_VAR: "i am a job env var"
          OVERWRITTEN: "Job var will overwrite the workflow var" 
        steps:
            - name: Print env Variables
              env:
                STEP_VAR: "i am a step env var"
                step-var2: 'I AM ANOTHEEER ENV VAR'
              run: |
                echo "Step env var: ${{ env.STEP_VAR }} "
                echo "Step env var 2: $step_var2"
                echo "Step job env var: ${{env.JOB_VAR}}"
                echo "Step workflow env var: ${{env.WORKLOF_VAR}}"
                echo "job overwriten env var: ${{env.OVERWRITTEN}}"
            - name: Overwrite jov Variables
              env:
                OVERWRITTEN: "ovrwritten on the step level"
              run: echo "Step workflow env var ${{env.OVERWRITTEN}}"